# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Settings specified in this file apply to all Gradle build subprocesses.
# For more details on how to configure your build environment, please refer to
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments for the daemon.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# For more details on this, please refer to:
# https://docs.gradle.org/docs/current/userguide/multi_project_builds.html#org.gradle.parallel=true
org.gradle.parallel=true

# AndroidX package structure to make sure it's enabled for material components and support libraries
android.useAndroidX=true
android.enableJetifier=true
