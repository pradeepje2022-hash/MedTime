name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # AGP 9.1.x requires Gradle 9.1.0 or newer.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # gradle-wrapper.jar is a binary not tracked in git — download it here.
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v9.3.1/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      # .env.example is required by the Gradle secrets plugin.
      - name: Ensure .env.example exists
        run: |
          if [ ! -f .env.example ]; then
            cat > .env.example << 'ENV_EOF'
          # GEMINI_API_KEY=MY_GEMINI_API_KEY
          ENV_EOF
          fi

      # Cache signing keystores so APK signatures stay consistent across runs.
      - name: Cache signing keystores
        uses: actions/cache@v4
        with:
          path: |
            debug.keystore
            my-upload-key.jks
          key: medminder-keystores-v1

      - name: Generate Keystores for Signing (only if not already cached)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MedMinder Release,O=AIStudio,C=US"
          fi

      - name: Build Debug APK, Release APK & Release Bundle (AAB)
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MedMinder-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MedMinder-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload Release AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: MedMinder-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
