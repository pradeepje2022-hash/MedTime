name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build MedTime APK
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 setup (Temurin - AGP 8.6.1 ekata onama)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Gradle setup + cache (gradlew nattath work karanawa)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 4. Debug APK build
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 6. APK upload (7 days keep karanna)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MedTime-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
