name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build MedTime APK
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 setup (Temurin - AGP 8.6.1 ekata onama)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Gradle cache - build fast karanna
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. gradlew permission (Linux ekata onama)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Debug APK build
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. APK upload (7 days keep karanna)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MedTime-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
